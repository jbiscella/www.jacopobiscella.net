<style>
  .article-list {
    list-style: none;
    padding: 0;
    margin: 1rem 0 1.5rem;
  }

  .article-item {
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border-color);
  }

  .article-item:last-child {
    border-bottom: none;
  }

  .article-title {
    font-size: 1rem;
    font-weight: 500;
  }

  .article-date {
    font-size: 0.82rem;
    color: var(--body-text-color-secondary, #6b7280);
  }

  .article-tags {
    font-size: 0.78rem;
    color: var(--body-text-color-secondary, #6b7280);
    font-style: italic;
  }

  .article-preview {
    margin: 0.3rem 0 0;
    font-size: 0.88rem;
    color: var(--body-text-color-secondary, #6b7280);
    line-height: 1.5;
  }


</style>

<!-- og:image for social sharing -->
<meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">

<!-- BlogPosting / Person schema for blog articles -->
{% if page.grand_parent == "Blog" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.post_excerpt | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "url": "{{ page.url | absolute_url }}",
  "author": {
    "@type": "Person",
    "name": "Jacopo Biscella",
    "url": "{{ site.url }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "Jacopo Biscella",
    "url": "{{ site.url }}"
  }{% if page.tags.size > 0 %},
  "keywords": {{ page.tags | join: ", " | jsonify }}{% endif %}
}
</script>
{% endif %}
